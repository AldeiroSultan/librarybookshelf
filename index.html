<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Bookshelf</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            overflow: hidden;
        }

        .bookshelf {
            width: 100vw;
            height: 100vh;
            min-height: 350px;
            margin: 0;
            position: relative;
            background-color: #111;
            cursor: none;
        }

        /* Previous base-layer and color-layer styles remain the same */
        .base-layer {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            background-color: #111;
            background-image: 
                /* Shelf */
                linear-gradient(to top, 
                    #222 5%, #111 6%,
                    #111 7%, transparent 7%),
                /* Rest of the gradients remain the same */
                linear-gradient(to bottom, #111 30%, transparent 30%),
                linear-gradient(to right, #222, #2e2e2e 5%, transparent 5%),
                linear-gradient(to right, transparent 6%, #222 6%, #2e2e2e 9%, transparent 9%),
                linear-gradient(to right, transparent 27%, #222 27%, #2e2e2e 34%, transparent 34%),
                linear-gradient(to right, transparent 51%, #222 51%, #2e2e2e 57%, transparent 57%),
                linear-gradient(to bottom, #111 35%, transparent 35%),
                linear-gradient(to right, transparent 42%, #222 42%, #2e2e2e 44%, transparent 44%),
                linear-gradient(to right, transparent 45%, #222 45%, #2e2e2e 47%, transparent 47%),
                linear-gradient(to right, transparent 48%, #222 48%, #2e2e2e 50%, transparent 50%),
                linear-gradient(to right, transparent 87%, #222 87%, #2e2e2e 91%, transparent 91%),
                linear-gradient(to bottom, #111 37.5%, transparent 37.5%),
                linear-gradient(to right, transparent 14%, #222 14%, #2e2e2e 20%, transparent 20%),
                linear-gradient(to bottom, #111 40%, transparent 40%),
                linear-gradient(to right, transparent 10%, #222 10%, #2e2e2e 13%, transparent 13%),
                linear-gradient(to right, transparent 21%, #222 21%, #2e2e2e 25%, transparent 25%),
                linear-gradient(to right, transparent 58%, #222 58%, #2e2e2e 64%, transparent 64%),
                linear-gradient(to right, transparent 92%, #222 92%, #2e2e2e 95%, transparent 95%),
                linear-gradient(to bottom, #111 48%, transparent 48%),
                linear-gradient(to right, transparent 96%, #222 96%, #2e2e2e 99%, transparent 99%),
                linear-gradient(to bottom, transparent 68.5%, transparent 76%, #111 76%, #111 77.5%, transparent 77.5%, transparent 86%, #111 86%, #111 87.5%, transparent 87.5%),
                linear-gradient(to right, transparent 35%, #222 35%, #2e2e2e 41%, transparent 41%),
                linear-gradient(to bottom, #111 68%, transparent 68%),
                linear-gradient(to right, transparent 78%, #333 78%, #333 80%, transparent 80%, transparent 82%, #333 82%, #333 83%, transparent 83%),
                linear-gradient(to right, transparent 66%, #222 66%, #2e2e2e 85%, transparent 85%);
            background-size: 300px 150px;
            background-position: center bottom;
        }

        .color-layer {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            background-color: #111;
            background-image: 
                /* Color layer gradients remain the same */
                linear-gradient(to top, tan 5%, #111 6%, #111 7%, transparent 7%),
                linear-gradient(to bottom, #111 30%, transparent 30%),
                linear-gradient(to right, firebrick, darkred 5%, transparent 5%),
                linear-gradient(to right, transparent 6%, tomato 6%, #ff3814 9%, transparent 9%),
                linear-gradient(to right, transparent 27%, darkolivegreen 27%, #4c6b1d 34%, transparent 34%),
                linear-gradient(to right, transparent 51%, salmon 51%, #f64d2f 57%, transparent 57%),
                linear-gradient(to bottom, #111 35%, transparent 35%),
                linear-gradient(to right, transparent 42%, teal 42%, #004d4d 44%, transparent 44%),
                linear-gradient(to right, transparent 45%, teal 45%, #004d4d 47%, transparent 47%),
                linear-gradient(to right, transparent 48%, teal 48%, #004d4d 50%, transparent 50%),
                linear-gradient(to right, transparent 87%, lightslategrey 87%, #708090 91%, transparent 91%),
                linear-gradient(to bottom, #111 37.5%, transparent 37.5%),
                linear-gradient(to right, transparent 14%, darkkhaki 14%, #bdb76b 20%, transparent 20%),
                linear-gradient(to bottom, #111 40%, transparent 40%),
                linear-gradient(to right, transparent 10%, olive 10%, #808000 13%, transparent 13%),
                linear-gradient(to right, transparent 21%, saddlebrown 21%, #8b4513 25%, transparent 25%),
                linear-gradient(to right, transparent 58%, saddlebrown 58%, #8b4513 64%, transparent 64%),
                linear-gradient(to right, transparent 92%, darkslategrey 92%, #2f4f4f 95%, transparent 95%),
                linear-gradient(to bottom, #111 48%, transparent 48%),
                linear-gradient(to right, transparent 96%, darkslategrey 96%, #2f4f4f 99%, transparent 99%),
                linear-gradient(to bottom, transparent 68.5%, transparent 76%, #111 76%, #111 77.5%, transparent 77.5%, transparent 86%, #111 86%, #111 87.5%, transparent 87.5%),
                linear-gradient(to right, transparent 35%, indianred 35%, #cd5c5c 41%, transparent 41%),
                linear-gradient(to bottom, #111 68%, transparent 68%),
                linear-gradient(to right, transparent 78%, rosybrown 78%, rosybrown 80%, transparent 80%, transparent 82%, rosybrown 82%, rosybrown 83%, transparent 83%),
                linear-gradient(to right, transparent 66%, brown 66%, #a52a2a 85%, transparent 85%);
            background-size: 300px 150px;
            background-position: center bottom;
            mask-image: radial-gradient(circle 150px at 50% 50%, black 0%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle 150px at 50% 50%, black 0%, transparent 100%);
        }

        .eyes {
            content: '';
            width: 25px;
            height: 10px;
            position: absolute;
            left: calc(50% + 59px);
            bottom: 100px;
            background-repeat: no-repeat;
            background-image: 
                radial-gradient(circle, white 50%, transparent 50%),
                radial-gradient(circle, white 50%, transparent 50%);
            background-size: 10px 10px;
            background-position: left center, right center;
            animation: blink 5000ms infinite;
        }

        .secret-book {
            position: absolute;
            left: calc(50% + 40px);
            bottom: 120px;
            width: 40px;
            height: 100px;
            cursor: pointer;
            display: none;
            transform-style: preserve-3d;
            transform: translateY(100px) rotateY(-20deg);
            transition: all 0.3s ease-out;
        }

        /* Book spine */
        .secret-book::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right,
                #8b0000 0%,
                #cc0000 15%,
                #ff0000 30%,
                #cc0000 85%,
                #8b0000 100%
            );
            transform: translateZ(0);
            box-shadow: 
                2px 2px 5px rgba(0, 0, 0, 0.3),
                -2px 0 3px rgba(0, 0, 0, 0.2);
        }

        /* Book side */
        .secret-book::after {
            content: '';
            position: absolute;
            right: -10px;
            top: 0;
            width: 20px;
            height: 100%;
            background: #d4d4d4;
            transform: rotateY(90deg);
            transform-origin: left;
            background: linear-gradient(to right,
                #cc0000 0%,
                #ffffff 20%,
                #f0f0f0 40%,
                #ffffff 60%,
                #cc0000 100%
            );
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
        }

        .secret-book.visible {
            display: block;
            animation: floatBook 1s ease-out forwards;
        }

        .secret-book:hover {
            transform: 
                translateY(-20px) 
                translateX(-10px) 
                rotate(-5deg) 
                rotateY(-30deg);
            filter: brightness(1.2);
        }

        /* Book top edge */
        .secret-book .top-edge {
            position: absolute;
            top: -10px;
            left: 0;
            width: 100%;
            height: 20px;
            background: linear-gradient(to bottom,
                #cc0000 0%,
                #ffffff 20%,
                #f0f0f0 40%,
                #ffffff 60%,
                #cc0000 100%
            );
            transform: rotateX(90deg);
            transform-origin: bottom;
        }

        /* Decorative book details */
        .secret-book .book-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateZ(90deg);
            color: #ffcccc;
            font-family: serif;
            font-size: 12px;
            white-space: nowrap;
            text-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
            opacity: 0.8;
        }

        @keyframes blink {
            0%, 52% { opacity: 0; }
            53%, 87% { opacity: 1; }
            64% { transform: scaleY(1); }
            67% { transform: scaleY(0); }
            70% { transform: scaleY(1); }
            88%, 100% { opacity: 0; }
        }

        @keyframes floatBook {
            0% { transform: translateY(100px); }
            100% { transform: translateY(0); }
        }

        .instruction-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 32px;
            font-weight: 700;
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.5),
                2px 2px 4px rgba(0, 0, 0, 0.3);
            opacity: 0;
            animation: floatText 2s ease-in-out infinite,
                       fadeIn 1s ease-out forwards;
            z-index: 1000;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .click-prompt {
            position: absolute;
            left: 50%;
            bottom: 230px;
            transform: translateX(-50%);
            color: #ff9999;
            font-family: Arial, sans-serif;
            font-size: 18px;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-out;
        }

        .click-prompt.visible {
            opacity: 1;
            animation: bounceText 1s ease-in-out infinite;
        }

        @keyframes floatText {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        @keyframes bounceText {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-5px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 0.8; }
        }

        /* Add a glowing effect when spotlight is near */
        .eyes.glow {
            filter: drop-shadow(0 0 5px white);
        }
    </style>
</head>
<body>
    <div class="bookshelf">
        <div class="instruction-text">Find the hidden book</div>
        <div class="base-layer"></div>
        <div class="color-layer"></div>
        <div class="eyes"></div>
        <a class="secret-book" href="https://example.com" target="_blank">
            <div class="top-edge"></div>
            <div class="book-title">Secrets</div>
        </a>
        <div class="click-prompt">Click me!</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const colorLayer = document.querySelector('.color-layer');
            const bookshelf = document.querySelector('.bookshelf');
            const eyes = document.querySelector('.eyes');
            const secretBook = document.querySelector('.secret-book');
            
            let isNearEyes = false;

            bookshelf.addEventListener('mousemove', (e) => {
                const rect = bookshelf.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Update spotlight position
                colorLayer.style.webkitMaskImage = `radial-gradient(circle 150px at ${x}px ${y}px, black 0%, transparent 100%)`;
                colorLayer.style.maskImage = `radial-gradient(circle 150px at ${x}px ${y}px, black 0%, transparent 100%)`;

                // Check if mouse is near the eyes
                const eyesRect = eyes.getBoundingClientRect();
                const distanceToEyes = Math.hypot(
                    e.clientX - (eyesRect.left + eyesRect.width/2),
                    e.clientY - (eyesRect.top + eyesRect.height/2)
                );

                const clickPrompt = document.querySelector('.click-prompt');
                
                if (distanceToEyes < 100 && !isNearEyes) {
                    isNearEyes = true;
                    eyes.classList.add('glow');
                    secretBook.classList.add('visible');
                    clickPrompt.classList.add('visible');
                    document.querySelector('.instruction-text').style.opacity = '0';
                } else if (distanceToEyes >= 100 && isNearEyes) {
                    isNearEyes = false;
                    eyes.classList.remove('glow');
                    secretBook.classList.remove('visible');
                    clickPrompt.classList.remove('visible');
                    document.querySelector('.instruction-text').style.opacity = '0.8';
                }
            });

            // Set initial spotlight position to center
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            colorLayer.style.webkitMaskImage = `radial-gradient(circle 150px at ${centerX}px ${centerY}px, black 0%, transparent 100%)`;
            colorLayer.style.maskImage = `radial-gradient(circle 150px at ${centerX}px ${centerY}px, black 0%, transparent 100%)`;
        });
    </script>
</body>
</html>
